name: Publish release

# Build locally, then create the release with the DLLs attached:
#   stable: gh release create v2.0.0 BundleInfo/*_2.0.0.dll --notes-file notes.md
#   beta:   gh release create beta-2.0.0 BundleInfo/*_2.0.0.dll --prerelease --target <branch> --notes-file notes.md
# The pipeline itself lives in mod-release.yml. To reuse it in another mod, copy this
# file and change the `with:` values (and `uses:` if the pipeline lives in another repo).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v2.0.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/mod-release.yml
    # From another repo: OvrwghtUnicorn/<shared-repo>/.github/workflows/mod-release.yml@main
    secrets: inherit
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
      thunderstore_namespace: ${{ vars.THUNDERSTORE_NAMESPACE }}
      nexus_file_group_il2cpp: ${{ vars.NEXUS_FILE_GROUP_IL2CPP }}
      nexus_file_group_mono: ${{ vars.NEXUS_FILE_GROUP_MONO }}
      # Optional: mod_name, bundle_dir, has_il2cpp, has_mono, display_name,
      #           thunderstore_community, thunderstore_categories, beta_prefix
